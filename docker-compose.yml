name: lab_fragmentacion

services:
  pg_master:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpass
      - POSTGRES_DB=labdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata_master:/var/lib/postgresql/data
      - ./pg_master/init.sql:/docker-entrypoint-initdb.d/init.sql
    depends_on:
      - pg_nodo_norte
      - pg_nodo_sur

  pg_nodo_norte:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpass
      - POSTGRES_DB=labdb
    ports:
      - "5434:5432"
    volumes:
      - pgdata_norte:/var/lib/postgresql/data
      - ./pg_nodo_norte/init.sql:/docker-entrypoint-initdb.d/init.sql

  pg_nodo_sur:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpass
      - POSTGRES_DB=labdb
    ports:
      - "5435:5432"
    volumes:
      - pgdata_sur:/var/lib/postgresql/data
      - ./pg_nodo_sur/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata_master:
  pgdata_norte:
  pgdata_sur: